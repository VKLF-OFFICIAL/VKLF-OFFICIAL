<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="300" viewBox="0 0 1000 300" role="img" aria-label="Jesús Yeste // VKLF — Hacker ético, eJPTv2, jugador de CTF">
  <defs>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#2a0d0d" stroke-width="1"/>
    </pattern>
    <radialGradient id="glow" cx="50%" cy="48%" r="60%">
      <stop offset="0" stop-color="#d70000" stop-opacity=".30"/>
      <stop offset=".55" stop-color="#d70000" stop-opacity=".06"/>
      <stop offset="1" stop-color="#0a0303" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a0303" stop-opacity="0"/>
      <stop offset="1" stop-color="#0a0303" stop-opacity=".95"/>
    </linearGradient>
    <linearGradient id="scan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff4d4d" stop-opacity="0"/>
      <stop offset=".5" stop-color="#ff4d4d" stop-opacity=".10"/>
      <stop offset="1" stop-color="#ff4d4d" stop-opacity="0"/>
    </linearGradient>
    <filter id="neon" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="type">
      <rect x="190" y="0" height="300" width="0">
        <animate attributeName="width" values="0;620" dur="2.6s" begin=".6s" fill="freeze"/>
      </rect>
    </clipPath>
    <style>
      .mono{font-family:'Courier New',Consolas,'Liberation Mono',monospace}
    </style>
  </defs>

  <!-- Fondo -->
  <rect width="1000" height="300" fill="#0a0303"/>
  <rect width="1000" height="300" fill="url(#grid)" opacity=".55"/>
  <rect width="1000" height="300" fill="url(#glow)"/>
  <rect y="150" width="1000" height="150" fill="url(#fade)"/>

  <!-- Línea de escaneo -->
  <rect x="0" y="-60" width="1000" height="60" fill="url(#scan)">
    <animate attributeName="y" values="-60;300" dur="4.5s" repeatCount="indefinite"/>
  </rect>

  <!-- Esquinas -->
  <g fill="none" stroke="#d70000" stroke-width="2">
    <path d="M20 46V20h26"/><path d="M954 20h26v26"/>
    <path d="M20 254v26h26"/><path d="M954 280h26v-26"/>
  </g>

  <!-- Barra superior -->
  <text x="40" y="44" class="mono" font-size="14" fill="#9a8a8a">root@vklf:~$ <tspan fill="#e8e8e8">./bienvenida.sh</tspan></text>
  <g transform="translate(790 39)">
    <circle r="5" fill="#ff4d4d">
      <animate attributeName="opacity" values="1;.25;1" dur="1.6s" repeatCount="indefinite"/>
    </circle>
    <text x="14" y="5" class="mono" font-size="14" fill="#9a8a8a">EN LÍNEA · GRANADA</text>
  </g>

  <!-- Título -->
  <g filter="url(#neon)">
    <text x="500" y="146" text-anchor="middle" class="mono" font-size="60" font-weight="700" letter-spacing="2" fill="#e8e8e8">JESÚS YESTE <tspan fill="#d70000">//</tspan> VKLF</text>
  </g>
  <!-- Fallo de señal sutil -->
  <text x="500" y="146" text-anchor="middle" class="mono" font-size="60" font-weight="700" letter-spacing="2" fill="#ff4d4d" opacity="0">JESÚS YESTE // VKLF
    <animate attributeName="opacity" values="0;0;.55;0;0;.4;0;0" keyTimes="0;.86;.87;.88;.93;.94;.95;1" dur="6s" repeatCount="indefinite"/>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 0;-4 1;3 -1;0 0;3 0;0 0;0 0" keyTimes="0;.86;.87;.88;.93;.94;.95;1" dur="6s" repeatCount="indefinite"/>
  </text>

  <!-- Subtítulo con efecto de escritura -->
  <g clip-path="url(#type)">
    <text x="500" y="200" text-anchor="middle" class="mono" font-size="22" fill="#ff4d4d">&gt; Hacker ético // eJPTv2 // Jugador de CTF_</text>
  </g>

  <!-- Línea inferior -->
  <line x1="300" y1="228" x2="700" y2="228" stroke="#2a0d0d" stroke-width="1"/>
  <text x="500" y="256" text-anchor="middle" class="mono" font-size="14" fill="#9a8a8a" letter-spacing="1">ASIR · LIONXSECURITY · INCIBE · HACK THE BOX</text>
</svg>
