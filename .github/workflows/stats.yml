name: Actualizar estadísticas

on:
  schedule:
    - cron: '17 4 * * *' # cada día a las 04:17 UTC
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/scripts/stats.mjs', '.github/workflows/stats.yml']

permissions:
  contents: write

concurrency:
  group: stats
  cancel-in-progress: true

jobs:
  stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generar assets/stats.svg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node .github/scripts/stats.mjs "${{ github.repository_owner }}" assets/stats.svg
      - name: Guardar cambios
        run: |
          if git diff --quiet -- assets/stats.svg; then echo "Sin cambios"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add assets/stats.svg
          git commit -m "chore: actualizar estadísticas"
          git push
