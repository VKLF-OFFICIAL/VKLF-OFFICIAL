<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="400" viewBox="0 0 1000 400" role="img" aria-label="Trayectoria. Experiencia: profesor en LionxSecurity y cibercooperante de INCIBE desde 09/2026; prácticas de desarrollo web en Close (05/2025); prácticas de soporte técnico en Random Consulting, Malta (04–07/2024). Formación: CFGS ASIR en IES Zaidín Vergeles (2024–2026); curso de Introducción al Hacking en LionxSecurity; CFGM SMR en IES Francisco Ayala (2022–2024).">
  <defs>
    <style>
      .mono{font-family:'Courier New',Consolas,'Liberation Mono',monospace}
      .k{font-size:13px;fill:#d70000;letter-spacing:2px}
      .d{font-size:13px;fill:#ff4d4d}
      .t{font-size:16px;font-weight:700;fill:#e8e8e8}
      .s{font-size:13px;fill:#9a8a8a}
    </style>
  </defs>

  <rect width="1000" height="400" fill="#0a0303"/>

  <!-- Columna: experiencia -->
  <rect x="1" y="1" width="584" height="398" rx="10" fill="#0d0606" stroke="#2a0d0d" stroke-width="2"/>
  <text x="28" y="40" class="mono k">// EXPERIENCIA</text>
  <line x1="40" y1="70" x2="40" y2="368" stroke="#2a0d0d" stroke-width="2"/>

  <g class="mono">
    <circle cx="40" cy="78" r="7" fill="#d70000"><animate attributeName="r" values="7;9;7" dur="2s" repeatCount="indefinite"/></circle>
    <text x="64" y="76" class="d">09/2026 — ACTUALIDAD</text>
    <text x="64" y="98" class="t">Profesor de ciberseguridad · LionxSecurity</text>
    <text x="64" y="118" class="s">Contenidos, prácticas y acompañamiento del alumnado</text>

    <circle cx="40" cy="156" r="7" fill="#d70000"><animate attributeName="r" values="7;9;7" dur="2s" begin="1s" repeatCount="indefinite"/></circle>
    <text x="64" y="154" class="d">09/2026 — ACTUALIDAD</text>
    <text x="64" y="176" class="t">Cibercooperante · INCIBE</text>
    <text x="64" y="196" class="s">Uso seguro de Internet entre menores, familias y docentes</text>

    <circle cx="40" cy="234" r="6" fill="#0d0606" stroke="#d70000" stroke-width="2"/>
    <text x="64" y="232" class="d">05/2025</text>
    <text x="64" y="254" class="t">Prácticas de desarrollo web · Close</text>
    <text x="64" y="274" class="s">PHP y Laravel · Granada</text>

    <circle cx="40" cy="312" r="6" fill="#0d0606" stroke="#d70000" stroke-width="2"/>
    <text x="64" y="310" class="d">04/2024 — 07/2024</text>
    <text x="64" y="332" class="t">Prácticas de soporte técnico · Random Consulting</text>
    <text x="64" y="352" class="s">Diagnóstico y reparación de equipos · Malta, en inglés</text>
  </g>

  <!-- Columna: formación -->
  <rect x="601" y="1" width="398" height="398" rx="10" fill="#0d0606" stroke="#2a0d0d" stroke-width="2"/>
  <text x="628" y="40" class="mono k">// FORMACIÓN</text>

  <g class="mono">
    <rect x="628" y="66" width="344" height="88" rx="8" fill="#140808" stroke="#2a0d0d"/>
    <text x="646" y="92" class="d">2024 — 2026</text>
    <text x="646" y="116" class="t">CFGS ASIR</text>
    <text x="646" y="138" class="s">IES Zaidín Vergeles · Granada</text>

    <rect x="628" y="166" width="344" height="88" rx="8" fill="#140808" stroke="#2a0d0d"/>
    <text x="646" y="192" class="d">HACKING ÉTICO</text>
    <text x="646" y="216" class="t">Introducción al Hacking</text>
    <text x="646" y="238" class="s">LionxSecurity</text>

    <rect x="628" y="266" width="344" height="88" rx="8" fill="#140808" stroke="#2a0d0d"/>
    <text x="646" y="292" class="d">2022 — 2024</text>
    <text x="646" y="316" class="t">CFGM SMR</text>
    <text x="646" y="338" class="s">IES Francisco Ayala</text>
  </g>
</svg>
