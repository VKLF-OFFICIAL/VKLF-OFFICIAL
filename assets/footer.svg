<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="170" viewBox="0 0 1000 170" role="img" aria-label="«La seguridad no es un producto, sino un proceso.» — Bruce Schneier">
  <defs>
    <linearGradient id="ln" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#d70000" stop-opacity="0"/>
      <stop offset=".5" stop-color="#d70000"/>
      <stop offset="1" stop-color="#d70000" stop-opacity="0"/>
    </linearGradient>
    <style>
      .mono{font-family:'Courier New',Consolas,'Liberation Mono',monospace}
    </style>
  </defs>
  <rect width="1000" height="170" fill="#0a0303"/>
  <rect x="100" y="20" width="800" height="2" fill="url(#ln)">
    <animate attributeName="opacity" values=".4;1;.4" dur="3s" repeatCount="indefinite"/>
  </rect>
  <text x="500" y="72" text-anchor="middle" class="mono" font-size="22" fill="#e8e8e8">«La seguridad no es un producto, sino un proceso.»</text>
  <text x="500" y="102" text-anchor="middle" class="mono" font-size="14" fill="#9a8a8a">— Bruce Schneier</text>
  <text x="500" y="146" text-anchor="middle" class="mono" font-size="13" fill="#d70000" letter-spacing="3">root@vklf:~$ exit<tspan fill="#ff4d4d">_<animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/></tspan></text>
</svg>
